<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="https://openlayers.org/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Using OpenLayers with Vite</title>
  </head>
  <body>
    <div id="map-container">
      <div id="map"></div>
      <div id ="map-info">
        <div id="info-header">
          <h3 class="info-text">Location:</h3>
          <h3 id="selected-location">None Selected</h3>
        </div>
        <div class="article-list" id="article">
          <ul id="articleList"></ul>
        </div>
      </div>
      <div id="author-container">
        <div id="author-header">
          <h3 class="info-text">Location:</h3>
          <h3 id="selected-location-author">None Selected</h3>
          <button id="sort-authors">
            <image src="./res/sort_icon.png" width="25" heigh="25"></image>
          </button>
        </div>
        <div class="article-list" id="authors">
          <ul id="authorList"></ul>
        </div>
      </div>
    </div>

    <div id="modalRoot" class="modal"></div>

    <script type="module" src="./main.js"></script>

  </body>
</html>
